<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">GitLab 工作台功能引导</title>
  <desc id="desc">从安全连接 GitLab，到分支管理、MR 待办、上线总览、冲突处理和操作审计的流程。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#171b26"/><stop offset="1" stop-color="#242a3a"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fc6d26"/><stop offset="1" stop-color="#fca326"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".25"/></filter>
  </defs>
  <rect width="960" height="540" rx="24" fill="url(#bg)"/>
  <path d="M0 430 C190 350 330 520 530 430 S800 340 960 410 V540 H0Z" fill="#fc6d26" opacity=".08"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
    <text x="64" y="78" fill="#fff" font-size="32" font-weight="700">GitLab 工作台</text>
    <text x="64" y="112" fill="#aeb8cf" font-size="17">连接一次，完成分支、Merge Request 与上线协作</text>
    <rect x="64" y="145" width="832" height="4" rx="2" fill="url(#accent)"/>
    <g filter="url(#shadow)">
      <g transform="translate(64 190)">
        <rect width="244" height="112" rx="14" fill="#30384c" stroke="#59647e"/>
        <circle cx="34" cy="34" r="17" fill="#fc6d26"/><path d="M27 35l5 5 10-12" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="62" y="39" fill="#fff" font-size="19" font-weight="650">安全连接</text>
        <text x="22" y="75" fill="#cbd3e5" font-size="14">自动识别 Git remote</text><text x="22" y="98" fill="#cbd3e5" font-size="14">Token 存入 SecretStorage</text>
      </g>
      <g transform="translate(358 190)">
        <rect width="244" height="112" rx="14" fill="#30384c" stroke="#59647e"/>
        <circle cx="34" cy="34" r="17" fill="#8b5cf6"/><path d="M26 28h16M26 34h11M26 40h14" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
        <text x="62" y="39" fill="#fff" font-size="19" font-weight="650">分支与 MR</text>
        <text x="22" y="75" fill="#cbd3e5" font-size="14">创建 release / hotfix</text><text x="22" y="98" fill="#cbd3e5" font-size="14">审阅待办与文件差异</text>
      </g>
      <g transform="translate(652 190)">
        <rect width="244" height="112" rx="14" fill="#30384c" stroke="#59647e"/>
        <circle cx="34" cy="34" r="17" fill="#ef4444"/><path d="M34 24v13M34 43v1" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
        <text x="62" y="39" fill="#fff" font-size="19" font-weight="650">冲突处理</text>
        <text x="22" y="75" fill="#cbd3e5" font-size="14">创建 conflict 分支</text><text x="22" y="98" fill="#cbd3e5" font-size="14">生成规范替代 MR</text>
      </g>
      <g transform="translate(210 354)">
        <rect width="244" height="104" rx="14" fill="#30384c" stroke="#59647e"/>
        <circle cx="34" cy="34" r="17" fill="#22c55e"/><path d="M26 40V31h5v9m4 0V25h5v15" fill="none" stroke="#fff" stroke-width="2.5"/>
        <text x="62" y="39" fill="#fff" font-size="19" font-weight="650">上线总览</text>
        <text x="22" y="77" fill="#cbd3e5" font-size="14">查看版本进度与风险</text>
      </g>
      <g transform="translate(506 354)">
        <rect width="244" height="104" rx="14" fill="#30384c" stroke="#59647e"/>
        <circle cx="34" cy="34" r="17" fill="#3b82f6"/><path d="M28 27h12v14H28zm3 4h6m-6 4h6" fill="none" stroke="#fff" stroke-width="2"/>
        <text x="62" y="39" fill="#fff" font-size="19" font-weight="650">操作审计</text>
        <text x="22" y="77" fill="#cbd3e5" font-size="14">追踪敏感操作，不记录代码</text>
      </g>
    </g>
    <path d="M315 246h32m263 0h32M480 312v29" stroke="#7d89a4" stroke-width="3" stroke-linecap="round" stroke-dasharray="5 8"/>
  </g>
</svg>
