name: IDEA plugin
on:
  push:
    paths:
      - 'apps/idea/**'
      - 'packages/contract-tests/**'
      - '.github/workflows/idea-plugin.yml'
  pull_request:
    paths:
      - 'apps/idea/**'
      - 'packages/contract-tests/**'
      - '.github/workflows/idea-plugin.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/idea
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: |
          mkdir -p build
          set -o pipefail
          ./gradlew :core:test buildPlugin verifyPluginProjectConfiguration --no-daemon 2>&1 | tee build/ci-build.log
      - name: Build diagnostics
        if: always()
        run: |
          if [ -f build/ci-build.log ]; then
            printf '```text\n' >> "$GITHUB_STEP_SUMMARY"
            tail -n 160 build/ci-build.log >> "$GITHUB_STEP_SUMMARY"
            printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: gitlab-workbench-idea
          path: apps/idea/build/distributions/*.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: idea-test-results
          path: apps/idea/core/build/reports/tests/test
