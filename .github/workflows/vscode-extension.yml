name: Package VS Code extension

on:
  push:
    paths:
      - 'apps/vscode/**'
      - 'packages/core/**'
      - 'packages/contract-tests/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'tsconfig.base.json'
      - '.github/workflows/vscode-extension.yml'
  pull_request:
    paths:
      - 'apps/vscode/**'
      - 'packages/core/**'
      - 'packages/contract-tests/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'tsconfig.base.json'
      - '.github/workflows/vscode-extension.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vscode-package-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.12.0'
  PNPM_VERSION: '10.33.2'

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Read package metadata
        id: package
        shell: bash
        run: |
          version="$(node -p "require('./apps/vscode/package.json').version")"
          filename="gitlab-auto-merge-request-${version}.vsix"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "filename=${filename}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Test and package VSIX
        run: pnpm run package:vsix
      - name: Verify package
        shell: bash
        run: |
          package="apps/vscode/${{ steps.package.outputs.filename }}"
          test -s "$package"
          unzip -t "$package"
          sha256sum "$package" | tee "${package}.sha256"
          {
            echo "### VS Code extension package"
            echo
            echo "- Version: \`${{ steps.package.outputs.version }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- File: \`${{ steps.package.outputs.filename }}\`"
            echo
            echo "Download the workflow artifact and use **Extensions → … → Install from VSIX**."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: gitlab-workbench-vscode-${{ steps.package.outputs.version }}-${{ steps.package.outputs.short_sha }}
          path: |
            apps/vscode/${{ steps.package.outputs.filename }}
            apps/vscode/${{ steps.package.outputs.filename }}.sha256
          if-no-files-found: error
          retention-days: 30
