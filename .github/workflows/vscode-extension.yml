name: VS Code extension

on:
  push:
    paths:
      - 'apps/vscode/**'
      - 'packages/core/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'tsconfig.base.json'
      - '.github/workflows/vscode-extension.yml'
  pull_request:
    paths:
      - 'apps/vscode/**'
      - 'packages/core/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'tsconfig.base.json'
      - '.github/workflows/vscode-extension.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test and package VSIX
        run: pnpm run package:vsix
      - uses: actions/upload-artifact@v4
        with:
          name: gitlab-workbench-vscode
          path: apps/vscode/*.vsix
          if-no-files-found: error
          retention-days: 14
